# Netlify configuration — only needed if you deploy on Netlify.
[build]
  publish = "."          # the site is plain static files; no build command

# Long-lived caching for the optimised images only (CSS/JS stay revalidated so edits show up).
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
